apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
spec:
  destination:
    namespace: hello
    server: https://kubernetes.default.svc
  source:
    path: apps/hello/
    repoURL: https://github.com/wassimrkik/homelab-platform
    targetRevision: main
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
