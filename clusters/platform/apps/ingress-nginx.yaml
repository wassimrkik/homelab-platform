apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  # deliberately NO resources-finalizer: deleting this app must not delete Argo CD
spec:
  project: default
  sources:
    - repoURL: https://github.com/kubernetes/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.15.1                 # same version as the bootstrap install
      helm:
        releaseName: ingress-nginx                   # same release name as the bootstrap install
        valueFiles:
          - $values/infrastructure/ingress-nginx/values.yaml
    - repoURL: https://github.com/wassimrkik/homelab-platform
      targetRevision: main
      ref: values                             # makes "$values" point at this repo
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true