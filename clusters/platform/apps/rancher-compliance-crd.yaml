apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher-compliance-crd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.rancher.io
      chart: rancher-compliance-crd
      targetRevision: 110.2.0+up1.5.3
      helm:
        releaseName: rancher-compliance-crd
  destination:
    server: https://kubernetes.default.svc
    namespace: compliance-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
