# Git hooks managed by lefthook (https://lefthook.dev).
#
# One-time setup per clone:
#   brew install lefthook gitleaks yamllint kubeconform
#   lefthook install
#
# The same checks run in CI on every pull request (.github/workflows/), so the
# hooks are a fast local safety net, not the only line of defence.
# Skip in a genuine emergency with LEFTHOOK=0 git commit ... (CI still runs).

pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      # Scans only what is staged, so it is fast and catches a secret before
      # it ever becomes a commit.
      run: gitleaks git --pre-commit --staged --redact --no-banner --verbose

    - name: yamllint
      glob: "*.{yaml,yml}"
      run: yamllint --strict {staged_files}

    - name: kubeconform
      # Only Kubernetes manifests; Helm values files under infrastructure/
      # are validated by rendering the chart in CI (scripts/helm-render.sh).
      glob:
        - "apps/**/*.{yaml,yml}"
        - "clusters/**/*.{yaml,yml}"
      run: scripts/kubeconform.sh {staged_files}

pre-push:
  jobs:
    - name: gitleaks
      # Scans the commits about to be pushed that the remote doesn't have yet,
      # which also covers commits made with hooks skipped.
      run: gitleaks git --redact --no-banner --verbose --log-opts="--branches --not --remotes"
